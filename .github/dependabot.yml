version: 2
updates:
  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directories:
      - "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directories:
      - "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
